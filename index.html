<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة عبدالله آل يحيى العقارية</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
    body { font-family: 'Cairo', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-16 selection:bg-emerald-500 selection:text-white">

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-6 left-6 z-50 bg-emerald-600 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-emerald-500 hidden transform transition-all duration-300 translate-y-20">
    <i data-lucide="check-circle" class="w-5 h-5"></i>
    <span id="toast-text" class="font-bold text-sm"></span>
  </div>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/85 backdrop-blur-xl border-b border-slate-800">
    <div class="container mx-auto px-4 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-slate-800 to-slate-900 p-0.5 shadow-lg border border-slate-700 flex items-center justify-center overflow-hidden">
          <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=150&q=80" alt="شعار" class="w-full h-full object-cover rounded-xl" />
        </div>
        <div>
          <h1 class="text-lg font-black tracking-wide text-white">منصة عبدالله آل يحيى</h1>
          <p class="text-xs text-slate-400">النظام السحابي الآمن للعروض والطلبات العقارية</p>
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div id="auth-container">
          <!-- Auth state managed dynamically -->
        </div>

        <div class="relative">
          <button onclick="toggleNotifications()" class="relative p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-800 text-slate-300 transition border border-slate-700">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span class="absolute -top-1 -right-1 w-5 h-5 bg-emerald-500 text-slate-950 rounded-full text-xs font-black flex items-center justify-center shadow-lg">1</span>
          </button>
          <div id="notifications-box" class="absolute left-0 mt-3 w-80 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-4 z-50 hidden">
            <div class="font-bold text-sm mb-3 pb-2 border-b border-slate-800 text-white flex justify-between items-center">
              <span>التنبيهات الفورية</span>
              <span class="text-xs text-emerald-400">سحابي</span>
            </div>
            <div class="space-y-2">
              <div class="p-3 rounded-xl bg-slate-950 text-xs border border-slate-800 text-slate-300">
                <p>مرحباً بك في منصة عبدالله آل يحيى الآمنة</p>
                <span class="text-[10px] text-slate-500 mt-1 block">الآن</span>
              </div>
            </div>
          </div>
        </div>

        <div id="add-btn-container"></div>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <div class="container mx-auto px-4 py-6">
    
    <!-- Stats Row -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between shadow-sm">
        <div>
          <div class="text-slate-400 text-xs font-bold mb-1">إجمالي قيمة العروض</div>
          <div id="stat-total-value" class="text-xl font-black text-white">0 <span class="text-sm font-normal text-slate-500">ر.س</span></div>
        </div>
        <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
          <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
        </div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between shadow-sm">
        <div>
          <div class="text-slate-400 text-xs font-bold mb-1">متوسط العائد الاستثماري</div>
          <div id="stat-avg-roi" class="text-xl font-black text-white">0% <span class="text-sm font-normal text-slate-500">سنوياً</span></div>
        </div>
        <div class="w-10 h-10 rounded-full bg-sky-500/10 text-sky-400 flex items-center justify-center">
          <i data-lucide="trending-up" class="w-5 h-5"></i>
        </div>
      </div>
      <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between shadow-sm">
        <div>
          <div class="text-slate-400 text-xs font-bold mb-1">طلبات الشراء النشطة</div>
          <div id="stat-requests-count" class="text-xl font-black text-white">0 <span class="text-sm font-normal text-slate-500">طلب</span></div>
        </div>
        <div class="w-10 h-10 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center">
          <i data-lucide="user" class="w-5 h-5"></i>
        </div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="flex flex-wrap gap-2 p-1 bg-slate-900 rounded-2xl w-full mx-auto mb-6 border border-slate-800">
      <button onclick="setActiveTab('all')" id="tab-all" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition bg-emerald-600 text-white shadow-lg shadow-emerald-900/30">الرئيسية الشاملة</button>
      <button onclick="setActiveTab('offers')" id="tab-offers" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition text-slate-400 hover:text-white">العروض العقارية</button>
      <button onclick="setActiveTab('requests')" id="tab-requests" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition text-slate-400 hover:text-white">طلبات العملاء</button>
      <button onclick="setActiveTab('favorites')" id="tab-favorites" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition text-slate-400 hover:text-white">المفضلة</button>
      <button onclick="setActiveTab('my_ads')" id="tab-my_ads" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition text-slate-400 hover:text-white">إعلاناتي</button>
      <button onclick="setActiveTab('matches')" id="tab-matches" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition text-slate-400 hover:text-white">المطابقة الذكية</button>
    </div>

    <!-- Filters and Search Bar -->
    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm mb-8 flex flex-col lg:flex-row gap-4">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 flex-1">
        <div class="relative md:col-span-2 lg:col-span-1">
          <i data-lucide="search" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 w-4 h-4"></i>
          <input type="text" id="search-input" oninput="applyFilters()" placeholder="ابحث بالمدينة، الحي أو رقم الإعلان..." class="w-full bg-slate-950 border border-slate-700 py-3 pr-11 pl-4 rounded-xl text-sm text-white placeholder-slate-500 focus:border-emerald-500 outline-none transition" />
        </div>
        <select id="filter-type" onchange="applyFilters()" class="bg-slate-950 border border-slate-700 py-3 px-4 rounded-xl text-sm text-white focus:border-emerald-500 outline-none transition cursor-pointer">
          <option value="الكل">كل أنواع العقارات</option>
          <option value="فيلا">فيلا</option>
          <option value="شقة">شقة</option>
          <option value="عمارة">عمارة</option>
          <option value="أرض">أرض</option>
          <option value="دور">دور</option>
          <option value="استراحة">استراحة</option>
        </select>
        <select id="filter-city" onchange="applyFilters()" class="bg-slate-950 border border-slate-700 py-3 px-4 rounded-xl text-sm text-white focus:border-emerald-500 outline-none transition cursor-pointer">
          <option value="الكل">كل المدن</option>
          <option value="الرياض">الرياض</option>
          <option value="جدة">جدة</option>
          <option value="الدمام">الدمام</option>
          <option value="مكة المكرمة">مكة المكرمة</option>
        </select>
        <select id="filter-purpose" onchange="applyFilters()" class="bg-slate-950 border border-slate-700 py-3 px-4 rounded-xl text-sm text-white focus:border-emerald-500 outline-none transition cursor-pointer">
          <option value="الكل">العملية (الكل)</option>
          <option value="بيع">بيع / شراء</option>
          <option value="إيجار">إيجار / إستئجار</option>
        </select>
      </div>
      
      <div class="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 shrink-0 self-start lg:self-stretch items-center">
        <button onclick="setViewMode('grid')" id="btn-grid" class="p-2.5 rounded-lg transition bg-slate-800 text-emerald-400 shadow-sm" title="عرض كقائمة/بطاقات"><i data-lucide="layout-grid" class="w-4 h-4"></i></button>
        <button onclick="setViewMode('map')" id="btn-map" class="p-2.5 rounded-lg transition text-slate-500 hover:text-slate-300" title="عرض الخريطة الشاملة"><i data-lucide="map-pin" class="w-4 h-4"></i></button>
      </div>
    </div>

    <!-- Content View Area -->
    <div id="content-container"></div>

  </div>

  <!-- Add Modal -->
  <div id="add-modal" class="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto hidden">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-3xl rounded-3xl p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
      <div class="flex justify-between items-center mb-6 border-b border-slate
