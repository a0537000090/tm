  <script>
    let activeTab = 'all';

    let isInitialLoad = true;

    const PROPERTY_TYPES = ["فيلا", "شقة", "عمارة", "أرض", "دور", "استراحة", "مكتب تجاري", "محل تجاري"];
    const CITIES_LIST = ["الرياض", "جدة", "الدمام", "مكة المكرمة", "المدينة المنورة", "الخبر"];

    // ==========================================
    // دالة توليد كرت الحالة (أفقي - تصميم احترافي ومساحة أوسع)
    // ==========================================
    function generateFlyerImage(docId) {
      const item = items.find(i => i.id_doc === docId);
      if (!item) return;
      if (item.type !== 'offer') {
        showToast('هذه الميزة متاحة للعروض العقارية فقط');
        return;
      }

      showToast('جاري تصميم الكرت الأفقي الأنيق...');

      const flyer = document.getElementById('flyer-template');
      const priceText = item.price ? Number(item.price).toLocaleString() + ' ر.س' : 'السعر حسب الطلب';
      let offerTypeTitle = 'عرض عقاري';
      if(item.offerType === 'بيع') offerTypeTitle = 'للبيع';
      else if (item.offerType === 'إيجار') offerTypeTitle = 'للإيجار';
      
      let streetStr = item.street || 'غير محدد';
      if(item.streetCount && item.streetCount !== 'شارع واحد') {
          streetStr += ` (${item.streetCount})`;
      }
      if(item.streetWidths && item.streetWidths.length > 0) {
         streetStr += ' - ' + item.streetWidths.join('م/') + 'م';
      }

      // إضافة قسم الدخل والعائد إذا كان متوفر
      let incomeHtml = '';
      if (item.rentIncome && item.rentIncome > 0) {
        incomeHtml = `
          <div class="bg-sky-50 rounded-2xl py-4 px-4 text-center mt-4 border border-sky-100 shadow-sm w-full">
            <span class="text-sky-800 text-lg font-bold block mb-1">الدخل الإيجاري السنوي</span>
            <div class="text-[38px] font-black text-sky-600 tracking-tight">${Number(item.rentIncome).toLocaleString()} ر.س</div>
            ${item.roi && item.roi > 0 ? `<div class="text-sky-500 font-bold text-lg mt-1">بعائد استثماري ${item.roi}%</div>` : ''}
          </div>
        `;
      }

      // تصميم الكرت مقسم لعمودين (يمين ويسار)
      flyer.innerHTML = `
        <div class="relative w-full h-full bg-slate-50 text-slate-900 flex p-8 gap-8" style="background-color: #f8fafc;">
          
          <!-- شريط جمالي يمين -->
          <div class="absolute top-0 right-0 bottom-0 w-4 bg-emerald-600"></div>
          
          <!-- القسم الأيمن (40%): العنوان والسعر والدخل -->
          <div class="w-[40%] flex flex-col justify-center items-center text-center pr-4 border-l-2 border-slate-200 pl-8">
            <span class="inline-block px-5 py-1.5 rounded-full bg-white text-slate-500 font-bold text-sm mb-4 border border-slate-200 shadow-sm">رقم المرجع: ${item.id}</span>
            
            <h2 class="text-[48px] font-black text-slate-900 leading-tight mb-2">
              ${item.propertyType} ${offerTypeTitle}
            </h2>
            
            <p class="text-[24px] font-bold text-slate-500 mb-8">${item.city} ${item.district ? ' - حي ' + item.district : ''}</p>
            
            <div class="bg-emerald-50 rounded-2xl py-5 px-4 text-center border border-emerald-100 shadow-sm w-full">
              <span class="text-emerald-800 text-lg font-bold block mb-1">السعر المطلوب</span>
              <div class="text-[42px] font-black text-emerald-600 tracking-tight">${priceText}</div>
            </div>

            ${incomeHtml}
          </div>

          <!-- القسم الأيسر (60%): التفاصيل بجدول أنيق -->
          <div class="w-[60%] flex flex-col justify-center">
            <div class="grid grid-cols-2 gap-x-8 gap-y-6 text-[22px] font-bold text-slate-700 bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
              
              <div class="flex flex-col border-b border-slate-100 pb-2">
                <span class="text-slate-400 text-lg">المساحة</span>
                <span class="text-slate-900 text-[26px]">${item.landArea || '-'} م²</span>
              </div>
              
              <div class="flex flex-col border-b border-slate-100 pb-2">
                <span class="text-slate-400 text-lg">الغرف والحمامات</span>
                <span class="text-slate-900 text-[26px]">${item.rooms || '-'} غرف | ${item.bathrooms || '-'} حمامات</span>
              </div>
              
              <div class="flex flex-col border-b border-slate-100 pb-2">
                <span class="text-slate-400 text-lg">الشارع والواجهات</span>
                <span class="truncate text-slate-900 text-[26px]">${streetStr}</span>
              </div>
              
              <div class="flex flex-col border-b border-slate-100 pb-2">
                <span class="text-slate-400 text-lg">عمر العقار</span>
                <span class="text-slate-900 text-[26px]">${item.propertyAge || '-'}</span>
              </div>
              
              <div class="flex flex-col border-b border-slate-100 pb-2">
                <span class="text-slate-400 text-lg">الأطوال</span>
                <span dir="ltr" class="text-slate-900 text-[26px] text-right">${item.dimensions || '-'}</span>
              </div>
              
              <div class="flex flex-col border-b border-slate-100 pb-2">
                <span class="text-slate-400 text-lg">حالة التفاوض</span>
                <span class="text-slate-900 text-[26px]">${item.isNegotiable !== 'لا' ? 'قابل للتفاوض' : 'غير قابل'}</span>

              منصة عبدالله آل يحيى العقارية
            </div>
          </div>

        html2canvas(flyer, {
          scale: 2, 
          useCORS: true, 
          backgroundColor: '#f8fafc'

          const link = document.createElement('a');

          link.click();
          showToast('تم تصميم الكرت الأفقي وتحميله بنجاح!');
        }).catch(err => {
          console.error(err);
          showToast('فشل إنشاء الصورة، يرجى المحاولة لاحقاً');
        });
      }, 1000);
    }

    }
    async function handleLogout() {
      if (!window.auth || !window.signOut) return;
      try {
        await window.signOut(window.auth); showToast('تم تسجيل الخروج'); items = []; appNotifications = []; isInitialLoad = true;
        renderNotificationsUI(); if (unsubscribeSnapshot) unsubscribeSnapshot();
      } catch (error) { console.error(error); }
    }
    function renderAuth() {
      const container = document.getElementById('auth-container');
      const addContainer = document.getElementById('add-btn-container');
      const guestView = document.getElementById('guest-view');
      const privateView = document.getElementById('private-view');
      
      if (window.isAuthenticated) {
        guestView.classList.add('hidden'); privateView.classList.remove('hidden'); document.getElementById('notifications-container').classList.remove('hidden');
        container.innerHTML = `<button onclick="handleLogout()" class="text-xs text-slate-400 hover:text-white flex items-center gap-1">خروج</button>`;
        addContainer.innerHTML = `<button onclick="openAddModal()" class="bg-emerald-600 text-white font-bold px-3 py-2 rounded-lg text-xs">إضافة</button>`;
      } else {
        guestView.classList.remove('hidden'); privateView.classList.add('hidden'); document.getElementById('notifications-container').classList.add('hidden');
        container.innerHTML = `<button onclick="handleGoogleLogin()" class="bg-white text-slate-900 px-3 py-1.5 rounded-lg text-xs font-bold">دخول</button>`;
        addContainer.innerHTML = '';
      }
      lucide.createIcons();
    }
    function fetchItems() {
      if (!window.db || !window.isAuthenticated) return;
      const colRef = window.collection(window.db, 'artifacts', window.appId, 'public', 'data', 'properties_v3');
      unsubscribeSnapshot = window.onSnapshot(colRef, (snapshot) => {
        const dataList = [];
        snapshot.forEach((docSnap) => { dataList.push({ id_doc: docSnap.id, ...docSnap.data() }); });
        items = dataList.reverse(); isInitialLoad = false; updateStats(); renderUI();
      });
    }
    function updateStats() {
      document.getElementById('stat-offers-count').innerText = items.filter(i => i.type === 'offer').length;
      document.getElementById('stat-requests-count').innerText = items.filter(i => i.type === 'request').length;
      document.getElementById('stat-all-count').innerText = items.length;
    }
    function setActiveTab(tab) { activeTab = tab; renderUI(); }
    function renderUI() {
      const container = document.getElementById('content-container');
      const filtered = items.filter(item => {
        if (activeTab === 'offers') return item.type === 'offer';
        if (activeTab === 'requests') return item.type === 'request';
        return true;
      });
      container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${filtered.map(item => {
        return `<div class="bg-slate-900 border border-slate-800 p-4 rounded-xl">
          <h3 class="text-lg font-bold text-white mb-2">${item.propertyType} ${item.type === 'offer' ? 'عرض' : 'طلب'}</h3>
          <p class="text-sm text-slate-400 mb-4">${item.city}</p>
          <div class="flex gap-2">
            <button onclick="openDetailModal('${item.id_doc}')" class="px-3 py-1.5 bg-emerald-600 text-white rounded text-xs">التفاصيل</button>
            ${item.type === 'offer' ? `<button onclick="generateFlyerImage('${item.id_doc}')" class="px-3 py-1.5 bg-fuchsia-600 text-white rounded text-xs" title="تصدير كرت واتساب أفقي">صورة حالة</button>` : ''}
          </div>
        </div>`;
      }).join('')}</div>`;
    }
    function openDetailModal(docId) { document.getElementById('detail-modal').classList.remove('hidden'); }
    function closeDetailModal() { document.getElementById('detail-modal').classList.add('hidden'); }
    function openAddModal() { document.getElementById('add-modal').classList.remove('hidden'); }
    function closeAddModal() { document.getElementById('add-modal').classList.add('hidden'); }
    function showToast(msg) {
      const t = document.getElementById('toast'); document.getElementById('toast-text').innerText = msg;
      t.classList.remove('hidden'); setTimeout(() => t.classList.add('hidden'), 4000);
    }
    function setAddMode(mode) { addMode = mode; }
    async function handleFormSubmit(e) { e.preventDefault(); closeAddModal(); }
  </script>
</body>
</html>
