<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>منصة عبدالله آل يحيى - النظام السحابي العقاري</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.3s ease-out; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 font-sans pb-16 selection:bg-emerald-500 selection:text-white" dir="rtl">

  <div id="toast-container"></div>

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800">
    <div class="container mx-auto px-4 h-20 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-slate-800 to-slate-900 p-0.5 shadow-lg border border-slate-700 flex items-center justify-center overflow-hidden">
          <img src="https://images.unsplash.com/photo-1524661135-423995f22d0b?auto=format&fit=crop&w=150&q=80" alt="شعار" class="w-full h-full object-cover rounded-xl">
        </div>
        <div>
          <h1 class="text-lg font-black tracking-wide text-white">منصة عبدالله آل يحيى</h1>
          <p class="text-xs text-slate-400">النظام السحابي الشامل للعروض والطلبات العقارية</p>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <div class="relative">
          <button id="notifications-btn" class="relative p-2.5 rounded-xl bg-slate-800/80 hover:bg-slate-800 text-slate-300 transition border border-slate-700">
            <i data-lucide="bell" class="w-5 h-5"></i>
            <span id="notifications-count" class="absolute -top-1 -right-1 w-5 h-5 bg-emerald-500 text-slate-950 rounded-full text-xs font-black flex items-center justify-center shadow-lg">1</span>
          </button>
          <div id="notifications-dropdown" class="hidden absolute left-0 mt-3 w-80 bg-slate-900 border border-slate-700 rounded-2xl shadow-2xl p-4 z-50"></div>
        </div>
        <button id="add-btn" class="bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-500 hover:to-teal-500 text-white font-bold px-5 py-2.5 rounded-xl shadow-lg shadow-emerald-900/30 flex items-center gap-2 transition transform active:scale-95 text-sm">
          <i data-lucide="plus" class="w-5 h-5"></i>
          إضافة عقار أو طلب
        </button>
      </div>
    </div>
  </header>

  <div class="container mx-auto px-4 py-6">
    <!-- لوحة الإحصائيات -->
    <div id="stats-container" class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6"></div>

    <!-- التبويبات -->
    <div id="tabs-container" class="flex flex-wrap gap-2 p-1 bg-slate-900 rounded-2xl w-full mx-auto mb-6 border border-slate-800"></div>

    <!-- البحث والتصفية -->
    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-800 shadow-sm mb-8 flex flex-col lg:flex-row gap-4">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 flex-1">
        <div class="relative md:col-span-2 lg:col-span-1">
          <i data-lucide="search" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 w-4 h-4"></i>
          <input id="search-input" type="text" placeholder="ابحث بالمدينة، الحي أو رقم الإعلان..." class="w-full bg-slate-950 border border-slate-700 py-3 pr-11 pl-4 rounded-xl text-sm text-white placeholder-slate-500 focus:border-emerald-500 outline-none transition">
        </div>
        <select id="filter-type" class="bg-slate-950 border border-slate-700 py-3 px-4 rounded-xl text-sm text-white focus:border-emerald-500 outline-none transition cursor-pointer">
          <option value="الكل">كل أنواع العقارات</option>
          <option value="فيلا">فيلا</option>
          <option value="شقة">شقة</option>
          <option value="عمارة">عمارة</option>
          <option value="أرض">أرض</option>
          <option value="دور">دور</option>
          <option value="استراحة">استراحة</option>
          <option value="مكتب تجاري">مكتب تجاري</option>
          <option value="محل تجاري">محل تجاري</option>
        </select>
        <select id="filter-city" class="bg-slate-950 border border-slate-700 py-3 px-4 rounded-xl text-sm text-white focus:border-emerald-500 outline-none transition cursor-pointer">
          <option value="الكل">كل المدن</option>
          <option value="الرياض">الرياض</option>
          <option value="جدة">جدة</option>
          <option value="الدمام">الدمام</option>
          <option value="مكة المكرمة">مكة المكرمة</option>
          <option value="المدينة المنورة">المدينة المنورة</option>
          <option value="الخبر">الخبر</option>
        </select>
        <select id="filter-purpose" class="bg-slate-950 border border-slate-700 py-3 px-4 rounded-xl text-sm text-white focus:border-emerald-500 outline-none transition cursor-pointer">
          <option value="الكل">العملية (الكل)</option>
          <option value="بيع">بيع / شراء</option>
          <option value="إيجار">إيجار / إستئجار</option>
        </select>
      </div>
      <div class="flex gap-1 bg-slate-950 p-1 rounded-xl border border-slate-800 shrink-0 self-start lg:self-stretch items-center">
        <button id="view-grid-btn" class="p-2.5 rounded-lg transition bg-slate-800 text-emerald-400 shadow-sm" title="عرض كقائمة">
          <i data-lucide="layout-grid" class="w-5 h-5"></i>
        </button>
        <button id="view-map-btn" class="p-2.5 rounded-lg transition text-slate-500 hover:text-slate-300" title="عرض الخريطة">
          <i data-lucide="map" class="w-5 h-5"></i>
        </button>
      </div>
    </div>

    <!-- المحتوى -->
    <div id="content-container"></div>
  </div>

  <!-- حاوية المودالات -->
  <div id="modals-container"></div>

<script>
// ============ الحالة العامة ============
const DEFAULT_FORM = {
  offerType: 'بيع', ownerRole: 'مالك', propertyType: 'فيلا', city: 'الرياض',
  district: '', street: '', streetCount: 'شارع واحد', streetWidth: '',
  mapUrl: '', landArea: '', buildingArea: '', rooms: '', bathrooms: '',
  propertyAge: '', floors: '', facades: [], features: [], otherFeatures: '',
  dimensions: '', planNumber: '', plotNumber: '', price: '', rentIncome: '',
  roi: '', isNegotiable: 'نعم', deedType: 'صك إلكتروني', deedNumber: '',
  imageUrl: '', ownerName: '', phone: '',
  requestType: 'شراء', requestRole: 'أنا مشتري', requestPurpose: 'السكن',
  districts: '', priceMax: '', isBudgetFlexible: 'نعم', areaMin: '',
  urgency: 'عاجل', paymentMethod: 'نقداً', details: ''
};

const DEFAULT_ITEM = {
  id_doc: 'default-1', id: 'OFF-101', type: 'offer',
  offerType: 'بيع', ownerRole: 'مالك', propertyType: 'فيلا', purpose: 'بيع',
  city: 'الرياض', district: 'العارض', street: 'الملك فهد', streetCount: 'شارعين',
  streetWidth: '20', mapUrl: 'https://maps.google.com', landArea: '450',
  buildingArea: '380', rooms: '5', bathrooms: '6', propertyAge: 'جديد', floors: '2',
  facades: ['شمالية', 'شرقية'], features: ['مصعد', 'مكيفات راكبة', 'مواقف سيارات'],
  otherFeatures: 'دخول ذكي وحديقة خاصة', dimensions: '20 في 22.5', planNumber: '1420',
  plotNumber: '88', price: '1850000', rentIncome: '', roi: '', isNegotiable: 'نعم',
  deedType: 'صك إلكتروني', deedNumber: '9876543210',
  imageUrl: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80',
  ownerName: 'عبدالله آل يحيى', phone: '0500000000', isFavorite: false, isMine: true
};

const state = {
  items: [],
  activeTab: 'all',
  searchTerm: '',
  filterType: 'الكل',
  filterCity: 'الكل',
  filterPurpose: 'الكل',
  viewMode: 'grid',
  addMode: 'offer',
  editingItem: null,
  isAddModalOpen: false,
  isEditModalOpen: false,
  formData: { ...DEFAULT_FORM },
  notifications: [{ id: 1, time: 'الآن', text: 'مرحباً بك في منصة عبدالله آل يحيى السحابية، تم تفعيل الحفظ التلقائي بنجاح' }]
};

// ============ التخزين المحلي ============
function loadItems() {
  try {
    const stored = localStorage.getItem('properties_v3');
    state.items = stored ? JSON.parse(stored) : [DEFAULT_ITEM];
    if (!stored) saveItems();
  } catch (e) {
    state.items = [DEFAULT_ITEM];
  }
}
function saveItems() {
  try { localStorage.setItem('properties_v3', JSON.stringify(state.items)); }
  catch (e) { console.error('Save error', e); }
}

// ============ أدوات مساعدة ============
function esc(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function showToast(msg) {
  const t = document.createElement('div');
  t.className = 'fixed bottom-6 left-6 z-50 bg-emerald-600 text-white px-5 py-3 rounded-2xl shadow-2xl flex items-center gap-3 border border-emerald-500 animate-bounce';
  t.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5"></i><span class="font-bold text-sm">${esc(msg)}</span>`;
  document.getElementById('toast-container').appendChild(t);
  lucide.createIcons();
  setTimeout(() => t.remove(), 3000);
}
function getMockPosition(id) {
  const hash = (id || '').split('').reduce((a, c) => a + c.charCodeAt(0), 0);
  return { top: `${20 + (hash % 60)}%`, left: `${20 + ((hash * 7) % 60)}%` };
}

// ============ خوارزمية المطابقة ============
function checkMatch(item) {
  if (item.type === 'offer') {
    return state.items.some(req =>
      req.type === 'request' &&
      (req.propertyType === item.propertyType || !req.propertyType) &&
      req.city === item.city &&
      (!req.districts || !item.district || req.districts.includes(item.district) || item.district.includes(req.districts)) &&
      (!req.priceMax || parseFloat(item.price) <= parseFloat(req.priceMax))
    );
  }
  return state.items.some(off =>
    off.type === 'offer' &&
    (off.propertyType === item.propertyType || !item.propertyType) &&
    off.city === item.city &&
    (!item.districts || !off.district || item.districts.includes(off.district) || off.district.includes(item.districts)) &&
    (!item.priceMax || parseFloat(off.price) <= parseFloat(item.price))
  );
}

function getFilteredItems() {
  return state.items.filter(item => {
    if (state.activeTab === 'matches') return checkMatch(item);
    let ok = true;
    if (state.activeTab === 'offers') ok = item.type === 'offer';
    if (state.activeTab === 'requests') ok = item.type === 'request';
    if (state.activeTab === 'favorites') ok = item.isFavorite;
    if (state.activeTab === 'my_ads') ok = item.isMine;
    const s = state.searchTerm.toLowerCase();
    const matchSearch = (item.city || '').toLowerCase().includes(s) ||
                        (item.district || '').toLowerCase().includes(s) ||
                        (item.districts || '').toLowerCase().includes(s) ||
                        (item.id || '').toLowerCase().includes(s);
    const matchType = state.filterType === 'الكل' || item.propertyType === state.filterType;
    const matchCity = state.filterCity === 'الكل' || item.city === state.filterCity;
    let purpose = item.purpose || item.requestType;
    if (purpose === 'شراء') purpose = 'بيع';
    if (purpose === 'إستئجار') purpose = 'إيجار';
    const matchPurpose = state.filterPurpose === 'الكل' || purpose === state.filterPurpose;
    return ok && matchSearch && matchType && matchCity && matchPurpose;
  });
}

// ============ عرض الإحصائيات ============
function renderStats() {
  const totalValue = state.items.filter(i => i.type === 'offer' && i.price)
    .reduce((s, c) => s + parseFloat(c.price || 0), 0);
  const withRoi = state.items.filter(i => i.type === 'offer' && parseFloat(i.roi) > 0);
  const avgRoi = withRoi.length > 0
    ? (withRoi.reduce((s, c) => s + parseFloat(c.roi), 0) / withRoi.length).toFixed(1) : 0;
  const reqCount = state.items.filter(i => i.type === 'request').length;

  document.getElementById('stats-container').innerHTML = `
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between shadow-sm">
      <div>
        <div class="text-slate-400 text-xs font-bold mb-1">إجمالي قيمة العروض</div>
        <div class="text-xl font-black text-white">${totalValue.toLocaleString()} <span class="text-sm font-normal text-slate-500">ر.س</span></div>
      </div>
      <div class="w-10 h-10 rounded-full bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
        <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
      </div>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between shadow-sm">
      <div>
        <div class="text-slate-400 text-xs font-bold mb-1">متوسط العائد الاستثماري</div>
        <div class="text-xl font-black text-white">${avgRoi}% <span class="text-sm font-normal text-slate-500">سنوياً</span></div>
      </div>
      <div class="w-10 h-10 rounded-full bg-sky-500/10 text-sky-400 flex items-center justify-center">
        <i data-lucide="trending-up" class="w-5 h-5"></i>
      </div>
    </div>
    <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between shadow-sm">
      <div>
        <div class="text-slate-400 text-xs font-bold mb-1">طلبات الشراء النشطة</div>
        <div class="text-xl font-black text-white">${reqCount} <span class="text-sm font-normal text-slate-500">طلب</span></div>
      </div>
      <div class="w-10 h-10 rounded-full bg-rose-500/10 text-rose-400 flex items-center justify-center">
        <i data-lucide="user" class="w-5 h-5"></i>
      </div>
    </div>`;
}

// ============ عرض التبويبات ============
const TABS = [
  { id: 'all', label: 'الرئيسية الشاملة' },
  { id: 'offers', label: 'العروض العقارية' },
  { id: 'requests', label: 'طلبات العملاء' },
  { id: 'favorites', label: 'المفضلة' },
  { id: 'my_ads', label: 'إعلاناتي' },
  { id: 'matches', label: 'المطابقة الذكية' }
];
function renderTabs() {
  document.getElementById('tabs-container').innerHTML = TABS.map(t => `
    <button data-tab="${t.id}" class="flex-1 py-3 px-4 rounded-xl font-bold text-sm transition ${state.activeTab === t.id ? 'bg-emerald-600 text-white shadow-lg shadow-emerald-900/30' : 'text-slate-400 hover:text-white'}">
      ${t.label}
    </button>
  `).join('');
}

// ============ عرض الإشعارات ============
function renderNotifications() {
  document.getElementById('notifications-count').textContent = state.notifications.length;
  document.getElementById('notifications-dropdown').innerHTML = `
    <div class="font-bold text-sm mb-3 pb-2 border-b border-slate-800 text-white flex justify-between items-center">
      <span>التنبيهات الفورية</span>
      <span class="text-xs text-emerald-400">سحابي</span>
    </div>
    <div class="space-y-2">
      ${state.notifications.map(n => `
        <div class="p-3 rounded-xl bg-slate-950 text-xs border border-slate-800 text-slate-300">
          <p>${esc(n.text)}</p>
          <span class="text-[10px] text-slate-500 mt-1 block">${esc(n.time)}</span>
        </div>
      `).join('')}
    </div>`;
}

// ============ عرض المحتوى (شبكة أو خريطة) ============
function renderContent() {
  const container = document.getElementById('content-container');
  const filtered = getFilteredItems();

  if (state.viewMode === 'map') {
    container.innerHTML = `
      <div class="relative w-full h-[600px] bg-slate-900 rounded-3xl overflow-hidden border border-slate-800 shadow-inner mb-10">
        <div class="absolute inset-0 opacity-40 bg-[radial-gradient(#10b981_1px,transparent_1px)] [background-size:24px_24px]"></div>
        ${filtered.map(item => {
          const pos = getMockPosition(item.id);
          return `
            <div class="absolute group z-10" style="top:${pos.top};left:${pos.left};">
              <div class="w-9 h-9 rounded-full border-2 border-slate-900 shadow-2xl flex items-center justify-center transform -translate-x-1/2 -translate-y-1/2 transition-transform hover:scale-125 cursor-pointer ${item.type === 'offer' ? 'bg-emerald-500 text-slate-950' : 'bg-sky-500 text-slate-950'}">
                <i data-lucide="${item.type === 'offer' ? 'home' : 'user'}" class="w-4 h-4"></i>
              </div>
              <div class="absolute bottom-full left-1/2 -translate-x-1/2 mb-2 w-52 bg-slate-900 border border-slate-700 rounded-xl p-3 shadow-2xl opacity-0 group-hover:opacity-100 pointer-events-none transition-opacity z-20">
                <div class="text-xs font-bold text-white mb-1">${esc(item.propertyType)} - ${esc(item.city)}${item.district ? ' (' + esc(item.district) + ')' : ''}</div>
                <div class="text-[11px] text-emerald-400 font-bold">${item.type === 'offer' ? (item.price ? Number(item.price).toLocaleString() + ' ر.س' : 'غير محدد') : (item.priceMax ? 'إلى ' + Number(item.priceMax).toLocaleString() + ' ر.س' : 'غير محدد')}</div>
              </div>
            </div>`;
        }).join('')}
        <div class="absolute bottom-4 right-4 bg-slate-900/90 backdrop-blur border border-slate-700 p-3 rounded-xl text-xs flex gap-4 shadow-lg">
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-emerald-500 block shadow-sm"></span> عروض عقارية</div>
          <div class="flex items-center gap-2"><span class="w-3 h-3 rounded-full bg-sky-500 block shadow-sm"></span> طلبات عملاء</div>
        </div>
      </div>`;
    lucide.createIcons();
    return;
  }

  if (filtered.length === 0) {
    container.innerHTML = `<div class="text-center py-20 text-slate-500 text-sm">لا توجد نتائج مطابقة</div>`;
    return;
  }

  container.innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${filtered.map(renderCard).join('')}</div>`;
  lucide.createIcons();
}

function renderCard(item) {
  const isOffer = item.type === 'offer';
  const hasMatch = checkMatch(item);
  const key = item.id_doc || item.id;

  return `
    <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-xl hover:border-slate-700 transition flex flex-col group" data-key="${esc(key)}">
      ${isOffer && item.imageUrl ? `
        <div class="relative h-52 overflow-hidden bg-slate-950">
          <img src="${esc(item.imageUrl)}" alt="عقار" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
          <div class="absolute top-4 right-4 bg-slate-950/80 backdrop-blur text-emerald-400 font-bold px-3 py-1 rounded-xl text-xs border border-slate-800">${esc(item.offerType || 'بيع')}</div>
          <button data-action="favorite" class="absolute top-4 left-4 p-2.5 rounded-full backdrop-blur border transition ${item.isFavorite ? 'bg-rose-500 text-white border-rose-600' : 'bg-slate-950/60 text-slate-300 border-slate-800 hover:text-white'}">
            <i data-lucide="heart" class="w-4 h-4" ${item.isFavorite ? 'fill="currentColor"' : ''}></i>
          </button>
        </div>` : ''}
      <div class="p-6 flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs text-emerald-400 font-bold bg-emerald-500/10 px-3 py-1 rounded-lg border border-emerald-500/20">
            ${isOffer ? 'عرض عقاري' : 'طلب عميل'} • ${esc(item.propertyType)}
          </span>
          <span class="text-xs text-slate-400 font-mono">${esc(item.id)}</span>
        </div>
        <h3 class="text-lg font-bold text-white mb-2">
          ${isOffer ? `${esc(item.propertyType)} في ${esc(item.city)} - ${esc(item.district || '')}` : `طلب ${esc(item.propertyType)} في ${esc(item.city)}`}
        </h3>
        ${hasMatch ? `<div class="mb-4 bg-emerald-500/10 border border-emerald-500/30 p-2 rounded-xl text-[11px] text-emerald-400 font-bold flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4"></i>يوجد ${isOffer ? 'طلب' : 'عرض'} مطابق متوفر في المنصة!</div>` : ''}
        <div class="space-y-2 text-sm text-slate-300 mb-6 flex-1">
          ${isOffer ? renderOfferDetails(item) : renderRequestDetails(item)}
        </div>
        <div class="pt-4 border-t border-slate-800 flex items-center justify-between">
          <div class="flex items-center gap-2 text-xs text-slate-400">
            <i data-lucide="user" class="w-4 h-4"></i>
            ${esc(item.ownerName || 'مقدم الطلب')}
          </div>
          <div class="flex items-center gap-1.5">
            <button data-action="pdf" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl transition" title="تصدير PDF"><i data-lucide="download" class="w-4 h-4"></i></button>
            <button data-action="share" class="p-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded-xl transition" title="مشاركة"><i data-lucide="share-2" class="w-4 h-4"></i></button>
            <button data-action="edit" class="p-2 bg-slate-800 hover:bg-slate-700 text-sky-400 rounded-xl transition" title="تعديل"><i data-lucide="edit" class="w-4 h-4"></i></button>
            <button data-action="delete" class="p-2 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-xl transition" title="حذف"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
          </div>
        </div>
      </div>
    </div>`;
}

function renderOfferDetails(item) {
  const rows = [

// ============ إعادة العرض الكلي ============
function renderAll() {
  renderStats();
  renderTabs();
  renderContent();
  renderNotifications();
  renderModals();
  lucide.createIcons();
}

// ============ الإجراءات ============
function toggleFavorite(item) {
  const idx = state.items.findIndex(i => i.id_doc === item.id_doc);
  if (idx !== -1) {
    state.items[idx].isFavorite = !state.items[idx].isFavorite;
    saveItems();
    renderContent();
    lucide.createIcons();
  }
}

function deleteItem(item) {
  if (!confirm(`هل أنت متأكد من حذف الإعلان ${item.id}؟`)) return;
  state.items = state.items.filter(i => i.id_doc !== item.id_doc);
  saveItems();
  renderAll();
  showToast('تم الحذف بنجاح');
}

function openAddModal() {
  state.addMode = 'offer';
  state.formData = { ...DEFAULT_FORM };
  state.isAddModalOpen = true;
  renderModals();
  lucide.createIcons();
}

function openEditModal(item) {
  state.editingItem = JSON.parse(JSON.stringify(item));
  state.isEditModalOpen = true;
  renderModals();
  lucide.createIcons();
}

function closeModals() {
  state.isAddModalOpen = false;
  state.isEditModalOpen = false;
  state.editingItem = null;
  renderModals();
}

function setAddMode(mode) {
  state.addMode = mode;
  renderModals();
  lucide.createIcons();
}

function updateFormField(key, val) {
  state.formData[key] = val;
  if (key === 'price' || key === 'rentIncome') {
    const p = parseFloat(state.formData.price);
    const r = parseFloat(state.formData.rentIncome);
    const box = document.getElementById('roi-display');
    if (p > 0 && r > 0) {
      const v = ((r / p) * 100).toFixed(2);
      state.formData.roi = v;
      if (box) box.textContent = `نسبة العائد الاستثماري المحسوبة آلياً: ${v}% سنوياً`;
    } else {
      state.formData.roi = '';
      if (box) box.textContent = '';
    }
  }
}

function updateEditField(key, val) {
  if (!state.editingItem) return;
  state.editingItem[key] = val;
  if (key === 'price' || key === 'rentIncome') {
    const p = parseFloat(state.editingItem.price);
    const r = parseFloat(state.editingItem.rentIncome);
    const box = document.getElementById('edit-roi-display');
    if (p > 0 && r > 0) {
      const v = ((r / p) * 100).toFixed(2);
      state.editingItem.roi = v;
      if (box) box.textContent = `نسبة العائد الاستثماري المحسوبة آلياً: ${v}% سنوياً`;
    } else {
      state.editingItem.roi = '';
      if (box) box.textContent = '';
    }
  }
}

function handleCreate(e) {
  e.preventDefault();
  const mode = state.addMode;
  const newId = mode === 'offer' ? `OFF-${Math.floor(100 + Math.random() * 900)}` : `REQ-${Math.floor(100 + Math.random() * 900)}`;
  const newItem = {
    id: newId,
    id_doc: 'doc_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
    type: mode,
    ...state.formData,
    isFavorite: false,
    isMine: true
  };
  state.items.push(newItem);
  saveItems();
  state.isAddModalOpen = false;
  state.formData = { ...DEFAULT_FORM };
  renderAll();
  showToast(mode === 'offer' ? 'تم حفظ العرض العقاري بنجاح' : 'تم حفظ الطلب بنجاح');
}

function handleUpdate(e) {
  e.preventDefault();
  if (!state.editingItem) return;
  const idx = state.items.findIndex(i => i.id_doc === state.editingItem.id_doc);
  if (idx !== -1) {
    state.items[idx] = { ...state.editingItem };
    saveItems();
  }
  state.isEditModalOpen = false;
  state.editingItem = null;
  renderAll();
  showToast('تم تحديث البيانات بنجاح');
}

function shareItem(item) {
  const isOffer = item.type === 'offer';
  let text;
  if (isOffer) {
    text = `رقم الإعلان: ${item.id}\nنوع العقار: ${item.propertyType}\nالمدينة: ${item.city}\nالحي: ${item.district || '-'}\nالشارع: ${item.street ? 'شارع ' + item.street : '-'}\nالمساحة: ${item.landArea || item.buildingArea || '-'} م²\nالأطوال: ${item.dimensions || '-'}\nعدد الغرف: ${item.rooms || '-'}\nعدد دورات المياه: ${item.bathrooms || '-'}\nالسعر: ${item.price ? Number(item.price).toLocaleString() + ' ر.س' : 'غير محدد'}${item.roi > 0 ? `\nالعائد الاستثماري: ${item.roi}%` : ''}\nرقم الخريطة: ${item.mapUrl || 'غير متوفر'}`;
  } else {
    text = `رقم الطلب: ${item.id}\nنوع الطلب: ${item.requestType} (${item.propertyType})\nالمدينة: ${item.city}\nالأحياء: ${item.districts || '-'}\nالميزانية: ${item.priceMax ? Number(item.priceMax).toLocaleString() + ' ر.س' : 'غير محدد'}\nالمساحة: من ${item.areaMin || '-'} م²\nالأطوال: ${item.dimensions || '-'}\nطريقة الدفع: ${item.paymentMethod || '-'}\nموعد الاحتياج: ${item.urgency || '-'}`;
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try {
    document.execCommand('copy') ? showToast('تم نسخ تفاصيل المشاركة بنجاح') : showToast('تعذر النسخ');
  } catch (e) { showToast('تعذر النسخ تلقائياً'); }
  document.body.removeChild(ta);
}

  return `<div><label class="block text-xs font-bold text-slate-400 mb-1">${label}</label>

            </div>
          </form>
        </div>
      </div>`;
  } else {
    container.innerHTML = '';
  }
}

// ============ التهيئة ============
function init() {
  loadItems();
  renderAll();

  // البحث
  document.getElementById('search-input').addEventListener('input', e => {
    state.searchTerm = e.target.value;
    renderContent();
    lucide.createIcons();
  });

  // الفلاتر
  document.getElementById('filter-type').addEventListener('change', e => {
    state.filterType = e.target.value;
    renderContent(); lucide.createIcons();
  });
  document.getElementById('filter-city').addEventListener('change', e => {
    state.filterCity = e.target.value;
    renderContent(); lucide.createIcons();
  });
  document.getElementById('filter-purpose').addEventListener('change', e => {
    state.filterPurpose = e.target.value;
    renderContent(); lucide.createIcons();
  });

  // أزرار العرض
  document.getElementById('view-grid-btn').addEventListener('click', () => {
    state.viewMode = 'grid';
    document.getElementById('view-grid-btn').className = 'p-2.5 rounded-lg transition bg-slate-800 text-emerald-400 shadow-sm';
    document.getElementById('view-map-btn').className = 'p-2.5 rounded-lg transition text-slate-500 hover:text-slate-300';
    renderContent(); lucide.createIcons();
  });
  document.getElementById('view-map-btn').addEventListener('click', () => {
    state.viewMode = 'map';
    document.getElementById('view-map-btn').className = 'p-2.5 rounded-lg transition bg-slate-800 text-emerald-400 shadow-sm';
    document.getElementById('view-grid-btn').className = 'p-2.5 rounded-lg transition text-slate-500 hover:text-slate-300';
    renderContent(); lucide.createIcons();
  });

  // زر الإضافة
  document.getElementById('add-btn').addEventListener('click', openAddModal);

  // الإشعارات
  document.getElementById('notifications-btn').addEventListener('click', () => {
    document.getElementById('notifications-dropdown').classList.toggle('hidden');
  });

  // التبويبات (event delegation)
  document.getElementById('tabs-container').addEventListener('click', e => {
    const btn = e.target.closest('[data-tab]');
    if (!btn) return;
    state.activeTab = btn.dataset.tab;
    renderTabs(); renderContent(); lucide.createIcons();
  });

  // إجراءات الكروت (event delegation)
  document.getElementById('content-container').addEventListener('click', e => {
    const btn = e.target.closest('[data-action]');
    if (!btn) return;
    const card = btn.closest('[data-key]');
    if (!card) return;
    const item = state.items.find(i => i.id_doc === card.dataset.key);
    if (!item) return;
    const a = btn.dataset.action;
    if (a === 'favorite') toggleFavorite(item);
    else if (a === 'pdf') exportToPDF(item);
    else if (a === 'share') shareItem(item);
    else if (a === 'edit') openEditModal(item);
    else if (a === 'delete') deleteItem(item);
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
